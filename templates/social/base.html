{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SocialApp{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'social/style.css' %}">
</head>
<body>
<header class="navbar">
    <a class="brand" href="{% url 'home' %}">SocialApp</a>
    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'profile' user.username %}">Profile</a>
            <form method="post" action="{% url 'logout' %}" class="inline-form">
                {% csrf_token %}
                <button class="nav-button" type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<script src="{% static 'social/script.js' %}"></script>
</body>
</html>
